[package]
name = "solayge"
version = "0.1.0"
description = "Solayge — plan and run sequential/parallel opencode tasks"
authors = ["you"]
edition = "2021"

[lib]
name = "solayge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "fs", "time", "sync", "net", "macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
# Local HTTP client for the opencode v2 server API (interactive questions and
# permission prompts). Plain HTTP to 127.0.0.1, so no TLS backend is needed.
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
# Local wall-clock timestamps in task logs (already in the dependency tree).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Encrypted-at-rest storage for per-project environment variables.
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
# Per-device identity, QR pairing, and device revocation for the mobile host.
solayge-identity = { path = "../crates/solayge-identity" }
# The versioned, transport-neutral remote protocol DTOs the host serves.
solayge-protocol = { path = "../crates/solayge-protocol" }
# The FCM gateway server, embedded so the desktop runs its own loopback push
# gateway when the user configures a Firebase service account.
solayge-push-gateway = { path = "../crates/solayge-push-gateway" }
# Optional: the Iroh-encrypted transport and connection manager. Enabled with
# the `mobile-network` feature; a normal desktop build does not pull it in.
solayge-network = { path = "../crates/solayge-network", optional = true }

[features]
default = ["mobile-network"]
# The Iroh-encrypted host listener phone clients connect to. On by default so a
# paired phone can reach the desktop; the listener is additionally opt-out at
# runtime via `SOLAYGE_IROH_HOST=0`.
mobile-network = ["dep:solayge-network"]

[dev-dependencies]
# Enables `tauri::test::mock_app`, so the host handshake can be tested without a
# real window or a real network endpoint.
tauri = { version = "2", features = ["test"] }

# macOS desktop notifications go through the modern UserNotifications
# framework. The older `NSUserNotificationCenter` (used by `notify-rust` /
# `mac-notification-sys`, and therefore by the Tauri notification plugin) is a
# "LegacyConnection" that `usernoted` refuses on current macOS, so notifications
# built on it are silently dropped. `macos_notify` drives `UNUserNotificationCenter`
# directly.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UNNotification",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationTrigger",
    "UNNotificationSound",
    "UNUserNotificationCenter",
] }
block2 = "0.6"

# Release builds unwind on panic on purpose: the scheduler runs every tick in
# its own task (`supervised_tick`) and turns a panic into a logged error so the
# loop keeps running. `panic = "abort"` would take the whole app down instead.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# A Tauri dependency tree is large, and `target/debug` is dominated by debug
# info and the incremental cache (tens of GB). Dropping debug info and the
# incremental cache keeps it small; temporarily set `debug = true` and
# `incremental = true` here if you need a debugger or faster edit/rebuild loops.
[profile.dev]
debug = false
incremental = false

[profile.dev.package."*"]
debug = false

# The desktop app is its own workspace root. Without this table, Cargo would
# discover the repository-level workspace (which hosts the mobile crate) and
# reject this package as a non-member. Keeping it standalone preserves the
# `src-tauri/target` output directory the build scripts depend on.
[workspace]
