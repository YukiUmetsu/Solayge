[package]
name = "solayge"
version = "0.1.0"
description = "Solayge — plan and run sequential/parallel opencode tasks"
authors = ["you"]
edition = "2021"

[lib]
name = "solayge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "fs", "time", "sync", "net", "macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
# Local HTTP client for the opencode v2 server API (interactive questions and
# permission prompts). Plain HTTP to 127.0.0.1, so no TLS backend is needed.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# Local wall-clock timestamps in task logs (already in the dependency tree).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Encrypted-at-rest storage for per-project environment variables.
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"

# macOS notifications must be delivered on the main thread, which the Tauri
# notification plugin does not do (it dispatches from a worker). We call the
# same underlying crate directly, on the main thread, in `scheduler::notify`.
[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"

# Release builds unwind on panic on purpose: the scheduler runs every tick in
# its own task (`supervised_tick`) and turns a panic into a logged error so the
# loop keeps running. `panic = "abort"` would take the whole app down instead.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# A Tauri dependency tree is large, and `target/debug` is dominated by debug
# info and the incremental cache (tens of GB). Dropping debug info and the
# incremental cache keeps it small; temporarily set `debug = true` and
# `incremental = true` here if you need a debugger or faster edit/rebuild loops.
[profile.dev]
debug = false
incremental = false

[profile.dev.package."*"]
debug = false
